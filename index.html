<!DOCTYPE html>
<html lang="tr" class="dark notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGY-1976 // AKILLI ODA ASİSTANI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #06080B; color: #E2E8F0; font-family: 'Inter', sans-serif; }
    .glass { background: rgba(15, 20, 28, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1rem; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-3xl mx-auto flex flex-col gap-4">

  <!-- HEADER -->
  <header class="glass p-4 flex items-center justify-between">
    <div>
      <h1 class="text-sm font-bold tracking-wider text-white">AGY-1976 // ODA YÖNETİM KOKPİTİ</h1>
      <p class="text-xs mono text-slate-400 mt-0.5">İZMİR / BUCA • CANLI ASİSTAN</p>
    </div>
    <div id="connectionStatus" class="px-2.5 py-1 rounded-full text-[10px] mono font-bold bg-amber-500/15 text-amber-400 border border-amber-500/30 animate-pulse">
      BAĞLANIYOR...
    </div>
  </header>

  <!-- PRATİK ODA KOÇU & YORUM KUTUSU -->
  <section class="glass p-4 border-emerald-500/30 flex flex-col gap-2.5 bg-gradient-to-br from-slate-900/90 to-emerald-950/20">
    <div class="flex items-center gap-2 text-emerald-400 text-xs font-bold mono">
      <span>💡</span> ODA KOÇU & PRATİK TAVSİYELER
    </div>
    <div id="practicalAdviceList" class="flex flex-col gap-1.5 text-xs mono text-slate-200 leading-relaxed">
      <div>Sensör verileri analiz ediliyor...</div>
    </div>
  </section>

  <!-- CANLI SENSÖR MATRİSİ -->
  <section class="grid grid-cols-2 md:grid-cols-4 gap-3">
    <!-- Sıcaklık -->
    <div class="glass p-4 flex flex-col justify-between">
      <span class="text-[10px] mono text-slate-400">ODA SICAKLIĞI</span>
      <div class="text-2xl font-bold mono text-white my-2" id="valTemp">--<span class="text-sm text-slate-400">°C</span></div>
      <span class="text-[9px] mono text-slate-400" id="descTemp">Ölçülüyor</span>
    </div>
    <!-- Nem & Çiy -->
    <div class="glass p-4 flex flex-col justify-between">
      <span class="text-[10px] mono text-slate-400">NEM & TERLEME</span>
      <div class="text-2xl font-bold mono text-cyan-300 my-2" id="valHum">--<span class="text-sm text-slate-400">%</span></div>
      <span class="text-[9px] mono text-slate-400" id="valDew">Çiy: --°C</span>
    </div>
    <!-- Hava Kalitesi (PPM) -->
    <div class="glass p-4 flex flex-col justify-between">
      <span class="text-[10px] mono text-slate-400">HAVA KALİTESİ</span>
      <div class="text-2xl font-bold mono text-emerald-400 my-2" id="valAir">--<span class="text-xs text-slate-400"> PPM</span></div>
      <span class="text-[9px] mono text-emerald-500" id="descAir">Temiz</span>
    </div>
    <!-- Ortam Işığı -->
    <div class="glass p-4 flex flex-col justify-between">
      <span class="text-[10px] mono text-slate-400">GÜN IŞIĞI / ORTAM</span>
      <div class="text-2xl font-bold mono text-amber-400 my-2" id="valLight">--<span class="text-sm text-slate-400">%</span></div>
      <span class="text-[9px] mono text-slate-400" id="descLight">Normal</span>
    </div>
  </section>

  <!-- IKEA UPPÅTVIND FAN KONTROLÜ -->
  <section class="glass p-4 border-cyan-500/20 flex flex-col gap-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span>🌪️</span>
        <h2 class="text-xs font-bold text-white mono">IKEA UPPÅTVIND HAVA ROBOTU</h2>
      </div>
      <span id="fanStatusBadge" class="text-[10px] mono text-slate-400">KAPALI</span>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <button onclick="setFan(0)" class="p-2.5 rounded-lg bg-rose-500/15 border border-rose-500/30 text-rose-300 font-mono text-xs font-bold hover:bg-rose-500/25">
        🛑 FANİ KAPAT (0)
      </button>
      <button onclick="setFan(3)" class="p-2.5 rounded-lg bg-cyan-500/15 border border-cyan-500/30 text-cyan-300 font-mono text-xs font-bold hover:bg-cyan-500/25">
        🌪️ ÇALIŞTIR (3)
      </button>
    </div>
  </section>

  <script>
    const FIREBASE_URL = "https://masaustubotu-default-rtdb.firebaseio.com/station.json?auth=seDMOC3iMWa7SNERZxASLx4qZJVfbo81uoRSc7tJ";

    async function fetchEspData() {
      try {
        const res = await fetch(FIREBASE_URL, { signal: AbortSignal.timeout(3000) });
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        document.getElementById('connectionStatus').innerText = "ESP32 (FIREBASE) CANLI ✓";
        document.getElementById('connectionStatus').className = "px-2.5 py-1 rounded-full text-[10px] mono font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30";

        document.getElementById('valTemp').innerHTML = `${data.temp.toFixed(1)}<span class="text-sm text-slate-400">°C</span>`;
        document.getElementById('valHum').innerHTML = `${data.humidity.toFixed(0)}<span class="text-sm text-slate-400">%</span>`;
        document.getElementById('valDew').innerText = `Çiy Noktası: ${data.dew_point ? data.dew_point.toFixed(1) : '--'}°C`;
        
        // Hava Kalitesi (0-3.3V arasını 0-100 endeksine çevir)
        // Varsayım: Voltaj arttıkça hava kirleniyor (MQ135 standart modül)
        let airIndex = (data.air / 3.3) * 100;
        let airText = "Temiz";
        let airColor = "text-emerald-400";
        if (airIndex > 60) { airText = "Tehlikeli"; airColor = "text-rose-500"; }
        else if (airIndex > 40) { airText = "Kötü"; airColor = "text-rose-400"; }
        else if (airIndex > 25) { airText = "Orta"; airColor = "text-amber-400"; }
        document.getElementById('valAir').innerHTML = `<span class="${airColor}">${airText}</span>`;
        
        // Işık Seviyesi (0-3.3V arasını 0-100% parlaklığa çevir)
        let lightPct = (data.light / 3.3) * 100;
        let lightText = "Karanlık";
        if (lightPct > 80) lightText = "Çok Aydınlık";
        else if (lightPct > 50) lightText = "Aydınlık";
        else if (lightPct > 20) lightText = "Loş";
        document.getElementById('valLight').innerHTML = `%${lightPct.toFixed(0)} <span class="text-sm text-slate-400">(${lightText})</span>`;

        // --- PRATİK YORUM MOTORU (GÜNLÜK HAYATÇI MANTIK) ---
        let advices = [];
        const currentHour = new Date().getHours();

        // Sıcaklık Yorumu
        if (data.temp > 27) {
          advices.push(`🔥 <b class='text-rose-400'>Oda sıcak (${data.temp.toFixed(1)}°C):</b> Çalışma verimin düşebilir. Varsa klimayı aç veya camı arala.`);
        } else if (data.temp < 20) {
          advices.push(`🧥 <b class='text-cyan-300'>Oda serin (${data.temp.toFixed(1)}°C):</b> Üşütmemek için üzerine bir şeyler alabilirsin.`);
        } else {
          advices.push(`👍 <b class='text-emerald-400'>Sıcaklık ideal:</b> Odaklanmak ve çalışmak için mükemmel ortam.`);
        }

        // Nem Yorumu
        if (data.humidity > 60) {
          advices.push(`💧 <b class='text-amber-400'>Nem biraz yüksek (%${data.humidity.toFixed(0)}):</b> Odada basık bir hava olabilir, biraz havalandırmak iyi gelir.`);
        } else if (data.humidity < 35) {
          advices.push(`🌵 <b class='text-amber-400'>Hava epey kuru (%${data.humidity.toFixed(0)}):</b> Boğazının kurumaması için bol su içmeyi unutma.`);
        }

        // Hava Kalitesi & Fan Tavsiyesi
        if (airIndex > 40) {
          advices.push(`⚠️ <b class='text-rose-400'>Hava ağırlaşmış:</b> İçerideki oksijen azalmış. <b>IKEA UPPÅTVIND fanını açmanı</b> veya odayı havalandırmanı şiddetle öneririm.`);
        } else {
          advices.push(`🍃 <b class='text-emerald-400'>Hava temiz:</b> İçerisi ferah, oksijen seviyesi gayet sağlıklı.`);
        }

        document.getElementById('practicalAdviceList').innerHTML = advices.map(a => `<div>${a}</div>`).join('');

      } catch (e) {
        document.getElementById('connectionStatus').innerText = "BAĞLANTI KOPTU ⚠️";
        document.getElementById('connectionStatus').className = "px-2.5 py-1 rounded-full text-[10px] mono font-bold bg-rose-500/15 text-rose-400 border border-rose-500/30 animate-pulse";
      }
    }

    async function setFan(level) {
      try {
        await fetch(`${ESP32_URL}/fan?level=${level}`);
        fetchEspData();
      } catch(e) {
        alert("Komut gönderilemedi!");
      }
    }

    setInterval(fetchEspData, 2000);
    fetchEspData();
  </script>
</body>
</html>

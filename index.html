<!DOCTYPE html>
<html lang="tr" class="dark notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGY-1976 // AKILLI ODA ASİSTANI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #06080B; color: #E2E8F0; font-family: 'Inter', sans-serif; }
    .glass { background: rgba(15, 20, 28, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1rem; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- MQTT kütüphanesi -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <script>
    // --- MQTT BAĞLANTISI (BULUT KONTROL) ---
    const mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    const LED_TOPIC = "agy1976/buca/esp32/light/oda_rgb_led/command";

    mqttClient.on('connect', () => {
      console.log('MQTT (Bulut) Bağlantısı Başarılı!');
    });

    function controlLed(r, g, b, state="ON") {
      if (r === 0 && g === 0 && b === 0) state = "OFF";
      
      const payload = {
        state: state,
        color: { r: r, g: g, b: b }
      };
      
      mqttClient.publish(LED_TOPIC, JSON.stringify(payload));
      
      // Butona basıldığında hafif bir efekt (Geri bildirim)
      document.body.style.boxShadow = `inset 0 0 50px rgba(${r},${g},${b}, 0.2)`;
      setTimeout(() => document.body.style.boxShadow = 'none', 300);
    }
  </script>
</head>

  </section>

  <script>
    const FIREBASE_URL = "https://masaustubotu-default-rtdb.firebaseio.com/station.json?auth=seDMOC3iMWa7SNERZxASLx4qZJVfbo81uoRSc7tJ";

    async function fetchEspData() {
      try {
        const res = await fetch(FIREBASE_URL, { signal: AbortSignal.timeout(3000) });
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        document.getElementById('connectionStatus').innerText = "ESP32 (FIREBASE) CANLI ✓";
        document.getElementById('connectionStatus').className = "px-2.5 py-1 rounded-full text-[10px] mono font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30";

        document.getElementById('valTemp').innerHTML = `${data.temp.toFixed(1)}<span class="text-sm text-slate-400">°C</span>`;
        document.getElementById('valHum').innerHTML = `${data.humidity.toFixed(0)}<span class="text-sm text-slate-400">%</span>`;
        document.getElementById('valDew').innerText = `Çiy Noktası: ${data.dew_point ? data.dew_point.toFixed(1) : '--'}°C`;
        
        // Hava Kalitesi (0-3.3V arasını 0-100 endeksine çevir)
        // Varsayım: Voltaj arttıkça hava kirleniyor (MQ135 standart modül)
        let airIndex = (data.air / 3.3) * 100;
        let airText = "Temiz";
        let airColor = "text-emerald-400";
        if (airIndex > 60) { airText = "Tehlikeli"; airColor = "text-rose-500"; }
        else if (airIndex > 40) { airText = "Kötü"; airColor = "text-rose-400"; }
        else if (airIndex > 25) { airText = "Orta"; airColor = "text-amber-400"; }
        document.getElementById('valAir').innerHTML = `<span class="${airColor}">${airText}</span>`;
        
        // Işık Seviyesi (LDR Karanlıkta yüksek voltaj veriyor, 3.3V = Zifiri Karanlık)
        let lightPct = ((3.3 - data.light) / 3.3) * 100;
        if (lightPct < 0) lightPct = 0;
        
        let lightText = "Karanlık";
        if (lightPct > 70) lightText = "Çok Aydınlık";
        else if (lightPct > 40) lightText = "Aydınlık";
        else if (lightPct > 15) lightText = "Loş";
        document.getElementById('valLight').innerHTML = `%${lightPct.toFixed(0)} <span class="text-sm text-slate-400">(${lightText})</span>`;

        // --- PRATİK YORUM MOTORU (GÜNLÜK HAYATÇI MANTIK) ---
        let advices = [];
        const currentHour = new Date().getHours();

        // Sıcaklık Yorumu
        if (data.temp > 27) {
          advices.push(`🔥 <b class='text-rose-400'>Oda sıcak (${data.temp.toFixed(1)}°C):</b> Çalışma verimin düşebilir. Varsa klimayı aç veya camı arala.`);
        } else if (data.temp < 20) {
          advices.push(`🧥 <b class='text-cyan-300'>Oda serin (${data.temp.toFixed(1)}°C):</b> Üşütmemek için üzerine bir şeyler alabilirsin.`);
        } else {
          advices.push(`👍 <b class='text-emerald-400'>Sıcaklık ideal:</b> Odaklanmak ve çalışmak için mükemmel ortam.`);
        }

        // Nem Yorumu
        if (data.humidity > 60) {
          advices.push(`💧 <b class='text-amber-400'>Nem biraz yüksek (%${data.humidity.toFixed(0)}):</b> Odada basık bir hava olabilir, biraz havalandırmak iyi gelir.`);
        } else if (data.humidity < 35) {
          advices.push(`🌵 <b class='text-amber-400'>Hava epey kuru (%${data.humidity.toFixed(0)}):</b> Boğazının kurumaması için bol su içmeyi unutma.`);
        }

        // Hava Kalitesi & Fan Tavsiyesi
        if (airIndex > 40) {
          advices.push(`⚠️ <b class='text-rose-400'>Hava ağırlaşmış:</b> İçerideki oksijen azalmış. <b>IKEA UPPÅTVIND fanını açmanı</b> veya odayı havalandırmanı şiddetle öneririm.`);
        } else {
          advices.push(`🍃 <b class='text-emerald-400'>Hava temiz:</b> İçerisi ferah, oksijen seviyesi gayet sağlıklı.`);
        }

        document.getElementById('practicalAdviceList').innerHTML = advices.map(a => `<div>${a}</div>`).join('');

      } catch (e) {
        document.getElementById('connectionStatus').innerText = "BAĞLANTI KOPTU ⚠️";
        document.getElementById('connectionStatus').className = "px-2.5 py-1 rounded-full text-[10px] mono font-bold bg-rose-500/15 text-rose-400 border border-rose-500/30 animate-pulse";
      }
    }

    async function setFan(level) {
      try {
        await fetch(`${ESP32_URL}/fan?level=${level}`);
        fetchEspData();
      } catch(e) {
        alert("Komut gönderilemedi!");
      }
    }

    setInterval(fetchEspData, 2000);
    fetchEspData();
  </script>
</body>
</html>
